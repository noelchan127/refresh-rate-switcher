name: Build and release

# - Every push to main or a feature/* branch, and every pull request (including Dependabot updates),
#   gets a test build plus end-to-end tests on Windows (.github/scripts/test-windows.ps1).
# - A release is only published when a v* tag is pushed, or when run manually from the Actions tab.
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match RefreshRateSwitcher.csproj and installer.nsi) – creates tag v<version>'
        required: true

# Read-only by default; only the release job below gets write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Check version numbers match
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          $app = ([xml](Get-Content RefreshRateSwitcher.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $nsi = (Select-String -Path installer.nsi -Pattern '^!define VERSION\s+"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "csproj $app, installer.nsi $nsi, release '$env:RELEASE_VERSION'"
          if ($app -ne $nsi) { throw "RefreshRateSwitcher.csproj ($app) and installer.nsi ($nsi) have different versions" }
          if ($env:RELEASE_VERSION) {
            $want = $env:RELEASE_VERSION -replace '^v', ''
            if ($want -ne $app) { throw "Release version $want doesn't match the app version ${app}: bump both files first" }
            if (-not (Select-String -Path .github/release-notes.md -SimpleMatch $app -Quiet)) { throw ".github/release-notes.md doesn't mention $app" }
          }

      - name: Build app
        run: dotnet build -c Release

      - name: Install NSIS
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis --version=3.11 -y --no-progress
          }
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build installer
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Write-Host "NSIS $(makensis /VERSION)"
          makensis installer.nsi

      - name: Test on Windows
        env:
          GH_TOKEN: ${{ github.token }}   # read-only; used to download the previous release for the upgrade test
        run: ./.github/scripts/test-windows.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RefreshRateSwitcher
          path: |
            out/*.exe
            bin/Release/net48/RefreshRateSwitcher.exe
            bin/Release/net48/RefreshRateSwitcher.exe.config

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write            # build provenance (proof the installer was built here)
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: RefreshRateSwitcher
          path: artifact

      - name: Checksums
        run: |
          cd artifact/out
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Lets anyone check the unsigned installer was built by this workflow from this repository:
      #   gh attestation verify RefreshRateSwitcher-Setup-x.y.z.exe --repo noelchan127/refresh-rate-switcher
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifact/out/*.exe

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Refresh Rate Switcher ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            artifact/out/*.exe
            artifact/out/SHA256SUMS.txt
