name: Hardware scenarios

# The real app on a throwaway Windows machine with virtual monitors (several refresh rates, plugged
# in and out) and a simulated charger/battery: see .github/scripts/test-hardware.ps1.
# Runs on pull requests, test/** branches and by hand from the Actions tab. Never releases anything.
on:
  push:
    branches: ['test/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Build app
        run: dotnet build -c Release

      - name: Hardware scenario tests
        env:
          GH_TOKEN: ${{ github.token }}   # read-only; used to find the virtual display driver's latest release
        run: ./.github/scripts/test-hardware.ps1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hardware-test-results
          path: test-results-hardware/
          if-no-files-found: ignore
